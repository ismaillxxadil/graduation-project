# Module 4 config. Relative paths are relative to this file.
# Each source is one log file. probe_id and log_type are set here, never guessed from the data.

database = "data/notline.db"   # keep it on a local disk (SQLite WAL does not work on network shares)
poll_interval = 1.0            # seconds between checks
read_chunk_bytes = 1048576     # max bytes read per file per transaction

[[sources]]
probe_id = "probe1"            # Zeek on sw2
log_type = "conn"
path = "../network/probe-logs/conn.log"

[[sources]]
probe_id = "probe1"
log_type = "dhcp"
path = "../network/probe-logs/dhcp.log"

[[sources]]
probe_id = "probe1"
log_type = "software"
path = "../network/probe-logs/software.log"

[[sources]]
probe_id = "probe2"            # Zeek on sw1
log_type = "conn"
path = "../network/probe2-logs/conn.log"

[[sources]]
probe_id = "probe2"
log_type = "dhcp"
path = "../network/probe2-logs/dhcp.log"

[[sources]]
probe_id = "probe2"
log_type = "software"
path = "../network/probe2-logs/software.log"

# include_archive = true (default): also read <log dir>/archive/<run>/<name>,
# the copies the probe start script moves aside before Zeek restarts.
